apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
  labels:
    app: {{ .Values.deploymentName }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploymentName }}
    spec:
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
        - name: {{ .Values.deploymentName }}
          image: "{{ .Values.image.uri }}:{{ .Values.image.tag }}"
          env: {{ include "codepush.env" (dict "env" (index .Values.deployment.spec.template.spec.containers 0).env "extra" .Values.extraEnv) | nindent 12 }}
          volumeMounts: {{ (index .Values.deployment.spec.template.spec.containers 0).volumeMounts | toYaml | nindent 12 }}
          ports:
            - containerPort: 50050
      volumes: {{ toYaml .Values.deployment.spec.template.spec.volumes | nindent 8 }}
