version: 2.1
orbs:
  aws-cli: circleci/aws-cli@4.1.3
  aws-ecr: circleci/aws-ecr@9.1.0
  node: circleci/node@5.2.0
  slack: circleci/slack@4.13.3
jobs:
  build-and-push-image:
    parameters:
      tag:
        type: string
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - persist_to_workspace:
          root: .
          paths:
            - rushowl-helm
      - run:
          name: Generate SSH Key
          command: |
            echo $GIT_ACCESS_KEY | base64 -d > ~/.ssh/id_rsa
            chmod 400 ~/.ssh/id_rsa
      - run:
          name: Add SSH Key to SSH Agent
          command: |
            eval $(ssh-agent -s)
            ssh-add ~/.ssh/id_rsa
      - run:
          name: Setup git config
          command: |
            echo $GIT_CONFIG | base64 -d > ~/.gitconfig
      - node/install:
          node-version: v18.18.0
      - run:
          name: Build
          command: |
            cd api
            npm install
            npm run build
      - aws-ecr/build_and_push_image:
          account_id: "$AWS_ACCOUNT_ID"
          auth:
            - aws-cli/setup:
                aws_access_key_id: AWS_ACCESS_KEY
                aws_secret_access_key: AWS_SECRET_ACCESS_KEY
                region: "$AWS_REGION"
          create_repo: true
          checkout: false
          dockerfile: ./api/Dockerfile
          public_registry: false
          push_image: true
          region: "$AWS_REGION"
          repo: $CIRCLE_PROJECT_REPONAME
          tag: "<< parameters.tag >>"
      - run:
          name: Cleanup
          command: |
            rm -f ~/.ssh/id_rsa
            rm -f ~/.gitconfig
      - slack/notify:
          event: fail
          template: basic_fail_1
      - slack/notify:
          event: pass
          template: basic_success_1
  # Azure AKS (AIT-38): copy this build's image ECR -> the cluster's ACR (same
  # digest) on the AKS cluster's in-cluster runner, whose job pods sign in to
  # the registry as the deploy identity (workload identity); see
  # scripts/azure/mirror-image.sh.
  mirror-image-acr:
    parameters:
      registry:
        type: string
      tag:
        type: string
      resource_class:
        type: string
    docker:
      # curl, jq, tar, bash; the same pinned image the other repos' mirror jobs use.
      - image: rushowl/alpine@sha256:10d44ed92df609ff7e5704505883468d43140d8988461594ad094d8f1bf99f55
    resource_class: << parameters.resource_class >>
    steps:
      - checkout
      - run:
          name: Copy the image from ECR to ACR (same digest)
          command: scripts/azure/mirror-image.sh "<< parameters.registry >>" "<< parameters.tag >>" "code-push-server"
      - slack/notify:
          event: fail
          template: basic_fail_1
  kube-deploy:
    parameters:
      namespace:
        type: string
      valuePath:
        type: string
      # A second values file laid over valuePath (AKS: values-prod-sg-aks.yaml).
      extraValuePath:
        type: string
        default: ""
      # Registry the cluster pulls from; empty = this account's ECR.
      image_uri:
        type: string
        default: ""
      tag:
        type: string
      kube_context:
        type: string
      resource_class:
        type: string
    docker:
      - image: reynandaptr/alpine:0.0.3
    resource_class: << parameters.resource_class >>
    steps:
      - run:
          name: Install kubeconfig
          command: |
            if [ -n "${KUBECONFIG_FILE}" ]; then
              mkdir -p $HOME/.kube
              echo -n "${KUBECONFIG_FILE}" | base64 -d > $HOME/.kube/config
            fi
      - run:
          name: Fix kubeconfig file permissions
          command: |
            chmod 600 $HOME/.kube/config
      - attach_workspace:
          at: .
      - run:
          name: Helm Install or Upgrade
          command: |
            CIRCLE_PROJECT_REPONAME=$CIRCLE_PROJECT_REPONAME
            NAMESPACE="<< parameters.namespace >>"
            VALUES_FILE="<< parameters.valuePath >>"
            IMAGE_URI="<< parameters.image_uri >>"
            [ -n "$IMAGE_URI" ] || IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$CIRCLE_PROJECT_REPONAME"
            EXTRA_VALUES=""
            [ -z "<< parameters.extraValuePath >>" ] || EXTRA_VALUES="--values << parameters.extraValuePath >>"
            IMAGE_TAG="<< parameters.tag >>"
            KUBE_CONTEXT="<< parameters.kube_context >>"

            if helm status $CIRCLE_PROJECT_REPONAME --namespace $NAMESPACE --kube-context $KUBE_CONTEXT > /dev/null 2>&1; then
              echo "Release $CIRCLE_PROJECT_REPONAME exists. Upgrading..."
              helm upgrade $CIRCLE_PROJECT_REPONAME rushowl-helm --set image.uri=$IMAGE_URI --set image.tag=$IMAGE_TAG --values $VALUES_FILE $EXTRA_VALUES --namespace $NAMESPACE --kube-context $KUBE_CONTEXT
            else
              echo "Release $CIRCLE_PROJECT_REPONAME does not exist. Installing..."
              helm install $CIRCLE_PROJECT_REPONAME rushowl-helm --set image.uri=$IMAGE_URI --set image.tag=$IMAGE_TAG --values $VALUES_FILE $EXTRA_VALUES --namespace $NAMESPACE --kube-context $KUBE_CONTEXT
            fi
      - run:
          name: Cleanup
          command: |
            rm -f $HOME/.kube/config
      - slack/notify:
          event: fail
          template: basic_fail_1
      - slack/notify:
          event: pass
          template: basic_success_1
workflows:
  cicd:
    jobs:
      - build-and-push-image:
          context:
            - production-github-git-access
            - production-aws-ecr-read-write
            - code-push-standalone
            - slack
          name: build-and-push-image-test
          tag: "${CIRCLE_BRANCH}-${CIRCLE_SHA1}"
          filters:
            tags:
              ignore: /.*/
            branches:
              only:
                - main
      - kube-deploy:
          context:
            - kubeconfig
            - production-aws-ecr-read-write
            - code-push-standalone
            - slack
          name: kube-deploy-prod
          namespace: "codepush"
          valuePath: "rushowl-helm/values.yaml"
          tag: "${CIRCLE_BRANCH}-${CIRCLE_SHA1}"
          kube_context: "rushtrail-prod-sg"
          resource_class: "sznnwvosn2in82bxrhcsj6/kube-eks-rushtrail-prod-sg"
          filters:
            tags:
              ignore: /.*/
            branches:
              only:
                - main
          requires:
            - build-and-push-image-test
      - kube-deploy:
          context:
            - kubeconfig-bn
            - production-aws-ecr-read-write
            - code-push-standalone
            - slack
          name: kube-deploy-prod
          namespace: "codepush"
          valuePath: "rushowl-helm/values-bn.yaml"
          tag: "${CIRCLE_BRANCH}-${CIRCLE_SHA1}"
          kube_context: "rushtrail-prod-bn"
          resource_class: "rushowl/kube-eks-hari-prod-bn2"
          filters:
            tags:
              ignore: /.*/
            branches:
              only:
                - main
          requires:
            - build-and-push-image-test
      # --- Azure AKS SG (AIT-38): copy the image ECR -> ACR, then helm upgrade
      # with values-prod-sg-aks.yaml laid over EKS SG's values.yaml (replicas
      # 0 until the SG switch window, in-cluster Redis). Separate jobs: a
      # failure here never blocks or changes the EKS and Brunei deploys.
      - mirror-image-acr:
          context:
            # ECR read (AWS_ACCOUNT_ID, AWS_REGION and keys).
            - production-aws-ecr-read-write
            - slack
          name: mirror-image-prod-sg-aks
          registry: "acrrowlprodsgsea.azurecr.io"
          tag: "${CIRCLE_BRANCH}-${CIRCLE_SHA1}"
          resource_class: "rushowl/azure-aks-prod-sg"
          filters:
            tags:
              ignore: /.*/
            branches:
              only:
                - main
          requires:
            - build-and-push-image-test
      - kube-deploy:
          context:
            - azure-kubeconfig-sg
            - slack
          name: kube-deploy-prod-sg-aks
          namespace: "codepush"
          valuePath: "rushowl-helm/values.yaml"
          extraValuePath: "rushowl-helm/values-prod-sg-aks.yaml"
          image_uri: "acrrowlprodsgsea.azurecr.io/code-push-server"
          tag: "${CIRCLE_BRANCH}-${CIRCLE_SHA1}"
          kube_context: "aks-prod-sg-sea"
          resource_class: "rushowl/azure-aks-prod-sg"
          filters:
            tags:
              ignore: /.*/
            branches:
              only:
                - main
          requires:
            - mirror-image-prod-sg-aks
